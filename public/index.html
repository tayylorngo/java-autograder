<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Java Autograder</title>
<style>
:root{--bg:#17111f;--card:#231a30;--ink:#f3ecfa;--mute:#b6a8c8;--line:#3a2d4d;--orange:#ff8a1f;--ok:#5fd68a;--bad:#ff6b6b;--code:#120d19}
@media (prefers-color-scheme:light){:root{--bg:#f6f1fb;--card:#fff;--ink:#1f1530;--mute:#5d4f73;--line:#ddd0ee;--orange:#c75b00;--ok:#16794a;--bad:#b3261e;--code:#f1ebf8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:1.7rem;margin:0 0 4px}h1 span{color:var(--orange)}
.sub{color:var(--mute);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin:0 0 6px}
input[type=text],select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--code);color:var(--ink);font:inherit}
.row{margin-bottom:16px}
.need{margin-top:8px;font-size:.92rem;color:var(--mute)}.need code{margin:0 2px}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}
code{background:var(--code);padding:2px 6px;border-radius:6px}
pre{background:var(--code);padding:10px 12px;border-radius:10px;overflow:auto;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;color:var(--mute)}
.drop.over,.drop:focus-visible{border-color:var(--orange);color:var(--ink);outline:none}
.drop b{color:var(--ink)}
button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--orange);color:#1b1000;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.score{font-size:2rem;font-weight:800}.score small{font-size:1rem;font-weight:500;color:var(--mute)}
.bar{height:10px;background:var(--code);border-radius:99px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--ok)}
ul{list-style:none;margin:0;padding:0}li{padding:9px 0;border-top:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--orange)}
details summary{cursor:pointer}details[open] summary{margin-bottom:4px}
.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-top:8px}
.err{border-color:var(--bad)}
.pump{font-size:.95rem;color:var(--mute)}
a{color:var(--orange)}
.lock{text-align:center;font-size:1.15rem;font-weight:700;border-color:var(--orange)}
</style></head>
<body><main>
<h1>Java <span>Autograder</span></h1>
<p class="sub">Halloween Pair Challenge &mdash; upload your <code>.java</code> file and see how many tests pass. You can submit as many times as you like. <a href="board.html" target="_blank">Leaderboard</a></p>
<div class="card lock" id="lock" hidden></div>

<div class="card">
  <div class="row"><label for="who">Your name(s)</label><input id="who" type="text" placeholder="e.g. Kostia &amp; Matthew" autocomplete="off"></div>
  <div class="row"><label for="prog">Program</label><select id="prog"></select>
    <div class="need" id="need"></div></div>
  <div class="row"><label>Your file</label>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a .java file"><div id="dropmsg"><b>Click to choose</b> or drag your .java file here</div></div>
    <input id="file" type="file" accept=".java" hidden></div>
  <button id="go" disabled>Run tests</button>
</div>
<div id="out" aria-live="polite"></div>
</main>
<script src="config.js"></script>
<script>
const API=(window.API_URL||"").replace(/\/$/,"");
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let programs=[],code=null,fname="",open=false;
try{$("who").value=localStorage.getItem("who")||""}catch(e){}
fetch(API+"/api/programs").then(r=>r.json()).then(p=>{programs=p;$("prog").innerHTML=p.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join("");need()}).catch(()=>{$("out").innerHTML='<div class="card err">Could not reach the grader. Tell Mr. Taylor.</div>'});
function cur(){return programs.find(p=>p.id===$("prog").value)}
function need(){const p=cur();if(p)$("need").innerHTML=`File name: <code>${p.cls}.java</code> &middot; required header: <code>${esc(p.header)}</code>`}
$("prog").onchange=()=>{need();$("out").innerHTML=""};
function ready(){$("go").disabled=!(open&&code!==null&&cur())}
async function poll(){try{const s=(await (await fetch(API+"/api/status")).json()).state;open=s==="open";const l=$("lock");l.hidden=open;l.textContent=s==="waiting"?"Waiting for Mr. Taylor to press Start...":"Submissions are closed.";ready()}catch(e){}}
poll();setInterval(poll,2500);
function load(f){if(!f)return;if(!/\.java$/i.test(f.name)){$("dropmsg").innerHTML='<span class="bad">That is not a .java file.</span>';code=null;ready();return}
  const r=new FileReader();r.onload=()=>{code=r.result;fname=f.name;$("dropmsg").innerHTML=`<b>${esc(f.name)}</b> ready &mdash; click to choose a different file`;ready()};r.readAsText(f)}
$("drop").onclick=()=>$("file").click();
$("drop").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("file").click()}};
$("file").onchange=e=>load(e.target.files[0]);
["dragover","dragenter"].forEach(t=>$("drop").addEventListener(t,e=>{e.preventDefault();$("drop").classList.add("over")}));
["dragleave","drop"].forEach(t=>$("drop").addEventListener(t,e=>{e.preventDefault();$("drop").classList.remove("over")}));
$("drop").addEventListener("drop",e=>load(e.dataTransfer.files[0]));
$("go").onclick=async()=>{
  const who=$("who").value.trim();
  if(!who){$("who").focus();$("out").innerHTML='<div class="card err">Type your name(s) first.</div>';return}
  try{localStorage.setItem("who",who)}catch(e){}
  $("go").disabled=true;$("go").textContent="Running tests...";$("out").innerHTML='<div class="card pump">Compiling and running your program...</div>';
  try{
    const r=await fetch(API+"/api/grade",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({student:who,program:$("prog").value,code})});
    const d=await r.json();if(r.status===423){open=false;poll();$("out").innerHTML="";}else show(d);
  }catch(e){$("out").innerHTML='<div class="card err">Could not reach the grader. Try again.</div>'}
  $("go").textContent="Run tests";ready();
};
function checks(c){return (c||[]).map(x=>`<li class="${x.ok?"ok":x.soft?"warn":"bad"}">${x.ok?"&#10003;":x.soft?"&#9888;":"&#10007;"} ${esc(x.msg)}</li>`).join("")}
function show(d){
  let h="";
  if(d.error){h+=`<div class="card err"><b class="bad">${esc(d.error)}</b>${d.detail?`<pre>${esc(d.detail)}</pre>`:""}<ul>${checks(d.checks)}</ul></div>`}
  else{
    const pct=Math.round(100*d.passed/d.total);
    h+=`<div class="card"><div class="score">${d.passed}<small> / ${d.total} tests passed</small></div><div class="bar"><i style="width:${pct}%"></i></div>${d.passed===d.total?'<b class="ok">All tests pass &mdash; nice work! Show your teacher.</b>':'<span class="pump">Fix the failing tests and submit again. Hidden tests only show pass or fail.</span>'}<ul style="margin-top:10px">${checks(d.checks)}</ul></div><div class="card"><ul style="margin:-9px 0">`;
    for(const t of d.results){
      const mark=t.pass?'<span class="ok">&#10003;</span>':'<span class="bad">&#10007;</span>';
      if(t.hidden||t.pass&&!t.note){h+=`<li>${mark} ${esc(t.name)}${t.hidden?" (hidden)":""}${t.note?` <span class="pump">&mdash; ${esc(t.note)}</span>`:""}</li>`;continue}
      h+=`<li><details ${t.pass?"":"open"}><summary>${mark} ${esc(t.name)}${t.note?` <span class="pump">&mdash; ${esc(t.note)}</span>`:""}</summary>
        <div class="lbl">Input typed</div><pre>${esc(t.input.join("\n"))}</pre>
        <div class="lbl">Expected output</div><pre>${esc(t.expected)}</pre>
        <div class="lbl">Your output</div><pre>${esc(t.actual)||"(nothing)"}</pre></details></li>`}
    h+="</ul></div>"}
  $("out").innerHTML=h;$("out").scrollIntoView({behavior:"smooth",block:"nearest"});
}
</script></body></html>
